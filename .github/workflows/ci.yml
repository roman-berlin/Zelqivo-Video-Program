name: CI

on:
  push:
    branches: [master, DEV]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ffmpeg and Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        # minimal known-good set for PySide6 offscreen on ubuntu-latest
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install package
        run: pip install -e ".[dev]"

      # two known Windows-path tests, tracked in issue #97
      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows' && !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12')
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          pytest --no-cov
          --deselect tests/test_file_utils.py::TestSafeBasename::test_safe_basename_normal_path
          --deselect tests/test_qa_artifacts.py::TestSanitizePath::test_windows_path

      # designated coverage job: pyproject addopts already carry --cov=src;
      # coverage.xml is uploaded as an artifact only (no Codecov account assumed)
      - name: Run tests with coverage (ubuntu, 3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          pytest --cov-report=xml
          --deselect tests/test_file_utils.py::TestSafeBasename::test_safe_basename_normal_path
          --deselect tests/test_qa_artifacts.py::TestSanitizePath::test_windows_path

      - name: Run tests (Windows, full suite)
        if: runner.os == 'Windows'
        run: pytest --no-cov

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      # advisory until the Phase 3 cleanup lands: repo has ~203 pre-existing ruff findings; do not let this mask NEW test failures
      - name: ruff
        continue-on-error: true
        run: ruff check .

      # advisory until the Phase 3 cleanup lands: repo has ~203 pre-existing ruff findings; do not let this mask NEW test failures
      - name: black
        continue-on-error: true
        run: black --check .

      # advisory until the Phase 3 cleanup lands: repo has ~203 pre-existing ruff findings; do not let this mask NEW test failures
      - name: mypy
        continue-on-error: true
        run: mypy .
